services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: firmos-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: firmos-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: firmos
      POSTGRES_USER: firmos_admin
      POSTGRES_PASSWORD: firmos_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firmos_admin -d firmos"]
      interval: 5s
      timeout: 5s
      retries: 5

  runner:
    image: firmos-runner
    build: .
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DATABASE_URL: postgresql://firmos_admin:firmos_password@postgres:5432/firmos
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    volumes:
      - ./tmp-remotes:/tmp-remotes
    deploy:
      replicas: 2

volumes:
  postgres_data:

